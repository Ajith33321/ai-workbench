{% extends "base.html" %}
{% block title %}Create account — {{ app_name }}{% endblock %}
{% block body_class %}app auth{% endblock %}
{% block body %}
<h1>Create an account</h1>
<p class="muted">Host accounts open Book &amp; Record. Owner accounts open Review Rewards.</p>
{% if error %}<div class="flash">{{ error }}</div>{% endif %}
<form method="post" action="/signup" class="card" style="max-width:460px">
  <label for="name">Name</label>
  <input id="name" name="name" type="text" required>
  <label for="email">Email</label>
  <input id="email" name="email" type="email" required>
  <label for="password">Password</label>
  <input id="password" name="password" type="password" required minlength="6">
  <label for="role">I am signing up as</label>
  <select id="role" name="role">
    <option value="host">Meeting host (Book &amp; Record)</option>
    <option value="owner">Restaurant owner (Review Rewards)</option>
  </select>
  <button class="btn" type="submit">Create account</button>
</form>
{% endblock %}
