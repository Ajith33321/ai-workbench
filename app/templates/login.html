{% extends "base.html" %}
{% block title %}Sign in — {{ app_name }}{% endblock %}
{% block body %}
<h1>Sign in</h1>
<p class="muted">Use your account, or one of the seeded demo logins on the home page.</p>
{% if error %}<div class="flash">{{ error }}</div>{% endif %}
<form method="post" action="/login" class="card" style="max-width:460px">
  <input type="hidden" name="next" value="{{ next }}">
  <label for="email">Email</label>
  <input id="email" name="email" type="email" required autocomplete="username">
  <label for="password">Password</label>
  <input id="password" name="password" type="password" required autocomplete="current-password">
  <button class="btn" type="submit">Sign in</button>
</form>
<p class="meta">New here? <a href="/signup">Create an account</a></p>
{% endblock %}
